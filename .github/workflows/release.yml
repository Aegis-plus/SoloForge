name: Release

# Push a version tag (e.g. v0.1.0) to build installers for Linux, Windows and
# macOS and publish them on a GitHub Release. Can also be started by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Apple silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.args }}

      - name: Install npm packages
        run: npm ci

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: SoloForge v__VERSION__
          releaseBody: |
            SoloForge v__VERSION__ — a solo virtual tabletop with Claude Code as your Game Master.

            **Download**
            - **Windows:** `.msi` or `-setup.exe`
            - **macOS:** `.dmg` (`aarch64` for Apple silicon, `x64` for Intel)
            - **Linux:** `.AppImage`, or `.deb` for Debian/Ubuntu

            **Before you play**
            - Install Claude Code and sign in once (`claude` in a terminal). No API key is needed for the GM.
            - Optional: add an OpenAI-compatible image endpoint (e.g. Nano Banana via OpenRouter) in Settings › Image Endpoint.

            These builds are not code-signed yet. On macOS, right-click the app and choose Open the first time; on Windows, choose More info › Run anyway.

            Includes material from the SRD 5.1 under CC-BY-4.0 (see NOTICE).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
