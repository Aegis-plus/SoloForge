name: Release

# Push a version tag (e.g. v0.1.0) to build SoloForge for Linux and Windows
# (x86_64) and publish it on a GitHub Release. Can also be started by hand.
#   Linux:   .AppImage, .deb, and the plain binary in a .tar.gz
#   Windows: .msi and an NSIS -setup.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: release
        name: Create the release (or reuse it if it exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id 2>/dev/null); then
            echo "Reusing release $TAG ($id)"
          else
            sed "s/__VERSION__/$VERSION/g" .github/release-notes.md > notes.md
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="SoloForge $TAG" -F body=@notes.md -F draft=false -F prerelease=false --jq .id)
            echo "Created release $TAG ($id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - name: Windows x86_64
            os: windows-latest
            args: "--bundles msi,nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ runner.os }}-release

      - name: Install npm packages
        run: npm ci

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Package the Linux binary as .tar.gz and attach it
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          NAME="SoloForge_${VERSION}_linux_x86_64"
          mkdir -p "dist-tar/$NAME"
          cp target/release/soloforge "dist-tar/$NAME/"
          cp README.md LICENSE NOTICE "dist-tar/$NAME/"
          tar -C dist-tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz"
          gh release upload "v$VERSION" "$NAME.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
